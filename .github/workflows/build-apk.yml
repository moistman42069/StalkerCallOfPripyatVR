name: Build OpenXRay Android APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Initialize submodules from scratch
      run: |
        git submodule sync --recursive
        git submodule update --init --force --recursive
        cd xray-16
        echo "=== xray-16 submodule state ==="
        git log --oneline -1
        echo "=== xrCore.h first 5 lines ==="
        head -5 src/xrCore/xrCore.h

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    
    - name: Install Android NDK
      run: |
        echo "y" | sdkmanager "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Install ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache
        ccache --max-size=4G
    
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Restore C/C++ compiler cache
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info

    - name: Report C/C++ compiler cache
      if: always()
      run: ccache --show-stats

    - name: Save C/C++ compiler cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: openxray-debug
        path: app/build/outputs/apk/debug/*.apk
